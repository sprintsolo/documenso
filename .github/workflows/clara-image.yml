# Builds the Clara patched Documenso image from a clara patch tag and publishes it to GHCR.
# Only this workflow is meant to run in this fork; every upstream workflow is disabled.
name: Clara image

on:
  workflow_dispatch:
    inputs:
      ref:
        description: 'Clara patch tag to build, e.g. v2.17.0-clara.1'
        required: true
        type: string

permissions:
  contents: read
  packages: write

concurrency:
  group: clara-image-${{ inputs.ref }}
  cancel-in-progress: false

jobs:
  build:
    # Pinned instead of ubuntu-latest: that label moves to Ubuntu 26 from 2026-10-19.
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    env:
      IMAGE: ghcr.io/sprintsolo/documenso
    steps:
      - name: Validate ref
        env:
          REF: ${{ inputs.ref }}
        run: |
          if [[ ! "$REF" =~ ^v[0-9]+\.[0-9]+\.[0-9]+-clara\.[0-9]+$ ]]; then
            echo "::error::ref must look like v2.17.0-clara.1, got '$REF'"
            exit 1
          fi

      - name: Free disk space
        run: |
          df -h /
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /usr/local/share/boost "${AGENT_TOOLSDIRECTORY:-/opt/hostedtoolcache}"
          df -h /

      - name: Check out the patch tag
        uses: actions/checkout@v4
        with:
          ref: refs/tags/${{ inputs.ref }}

      - name: Resolve source commit
        id: source
        run: echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # Telemetry build args are left empty on purpose, unlike the upstream publish workflow.
      - name: Build and push (amd64)
        id: build
        uses: docker/build-push-action@v6
        with:
          context: .
          file: docker/Dockerfile
          platforms: linux/amd64
          push: true
          provenance: false
          tags: ${{ env.IMAGE }}:${{ inputs.ref }}
          labels: |
            org.opencontainers.image.source=https://github.com/sprintsolo/documenso
            org.opencontainers.image.revision=${{ steps.source.outputs.sha }}
            org.opencontainers.image.version=${{ inputs.ref }}
            org.opencontainers.image.licenses=AGPL-3.0

      - name: Print the deployment pin
        env:
          DIGEST: ${{ steps.build.outputs.digest }}
          REF: ${{ inputs.ref }}
          SOURCE_SHA: ${{ steps.source.outputs.sha }}
        run: |
          if [[ ! "$DIGEST" =~ ^sha256:[a-f0-9]{64}$ ]]; then
            echo "::error::unexpected image digest '$DIGEST'"
            exit 1
          fi
          {
            echo '```'
            echo "DOCUMENSO_IMAGE=${IMAGE}:${REF}@${DIGEST}"
            echo "DOCUMENSO_RELEASE=${REF}"
            echo "DOCUMENSO_SOURCE_COMMIT=${SOURCE_SHA}"
            echo '```'
          } | tee -a "$GITHUB_STEP_SUMMARY"
